# vhdl_lint.toml — VHDL lint configuration of the sram IP (standard hosts).
#
# lint_sram.py analyses every VHDL-2008 RTL file with `ghdl -a --std=08` in
# compile order (IP/common synchronizers and the four memory-bus adapters,
# then sram_pkg ... sram_core and the eight tops; see vhdl_files() in the
# runner); any warning or error fails. No VHDL lint on csun.edu (no GHDL;
# SpyGlass has no VHDL-2008 path).

[ghdl]
std = "08"
relaxed = false
